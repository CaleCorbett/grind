name: Grind
options:
  bundleIdPrefix: com.cale
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
settings:
  SWIFT_VERSION: "5.9"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  CODE_SIGN_IDENTITY: "-"
  CODE_SIGN_STYLE: Manual
  DEVELOPMENT_TEAM: ""
targets:
  Grind:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: App-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.cale.Grind
            CFBundleURLSchemes:
              - grind
        NSServices:
          - NSMenuItem:
              default: Send to Grind
            NSMessage: handleSendToGrindService
            NSPortName: Grind
            NSSendTypes:
              - NSPasteboardTypeString
              - public.utf8-plain-text
              - NSStringPboardType
        NSRemindersUsageDescription: Grind accesses your reminders so you can import tasks into your daily board.
        NSRemindersFullAccessUsageDescription: Grind accesses your reminders so you can import tasks into your daily board.
        NSCalendarsUsageDescription: Grind shows your today calendar events alongside your tasks.
        NSCalendarsFullAccessUsageDescription: Grind shows your today calendar events alongside your tasks.
    entitlements:
      path: App-Entitlements.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cale.Grind
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_ENTITLEMENTS: App-Entitlements.plist
