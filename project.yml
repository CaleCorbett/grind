name: Grind
options:
  bundleIdPrefix: com.cale
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
settings:
  SWIFT_VERSION: "5.9"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  CODE_SIGN_IDENTITY: "-"
  CODE_SIGN_STYLE: Manual
  DEVELOPMENT_TEAM: ""
targets:
  Grind:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: App-Info.plist
    entitlements:
      path: App-Entitlements.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cale.Grind
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_ENTITLEMENTS: App-Entitlements.plist
