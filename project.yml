name: Slate
options:
  bundleIdPrefix: com.cale
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
settings:
  SWIFT_VERSION: "5.9"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  CODE_SIGN_IDENTITY: "-"
  CODE_SIGN_STYLE: Manual
  DEVELOPMENT_TEAM: ""
targets:
  Slate:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: App-Info.plist
      properties:
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleName: Slate
        CFBundleDisplayName: Slate
        CFBundleURLTypes:
          - CFBundleURLName: com.cale.Slate
            CFBundleURLSchemes:
              - slate
        NSServices:
          - NSMenuItem:
              default: Send to Slate
            NSMessage: handleSendToSlateService
            NSPortName: Slate
            NSSendTypes:
              - NSPasteboardTypeString
              - public.utf8-plain-text
              - NSStringPboardType
        NSRemindersUsageDescription: Slate accesses your reminders so you can import tasks into your daily board.
        NSRemindersFullAccessUsageDescription: Slate accesses your reminders so you can import tasks into your daily board.
        NSCalendarsUsageDescription: Slate shows your today calendar events alongside your tasks.
        NSCalendarsFullAccessUsageDescription: Slate shows your today calendar events alongside your tasks.
    entitlements:
      path: App-Entitlements.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cale.Slate
      PRODUCT_NAME: Slate
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_ENTITLEMENTS: App-Entitlements.plist
